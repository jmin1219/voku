services:
  voku:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - VOKU_PROVIDER=${VOKU_PROVIDER:-groq}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes:
      # Persist DB across container restarts (optional — image has seeded DB)
      - voku-data:/app/data
    restart: unless-stopped

volumes:
  voku-data:
